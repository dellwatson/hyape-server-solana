[toolchain]
solana_version = "1.17.0"
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
game_server = "ACSCmLSGgn3kxQyqvDDeDqopzooM17aNEBuWt1pwHBXp"

[programs.devnet]
game_server = "ACSCmLSGgn3kxQyqvDDeDqopzooM17aNEBuWt1pwHBXp"

[registry]
url = "https://api.apr.dev"

# Default provider for testing
[provider]
cluster = "localnet"  # Changed to lowercase
wallet = "~/.config/solana/id.json"

# Provider configuration for deployment
[provider.deploy]
cluster = "devnet"  # Changed to lowercase
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/*"]
# members = ["programs/*", "programs-ecs/components/*", "programs-ecs/systems/*"]

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
deploy = "anchor deploy --provider.cluster devnet"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[[test.genesis]]
address = "WorLD15A7CrDwLcLy4fRqtaTb9fbd8o8iqiEMUDse2n"
program = "tests/fixtures/world.so"
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://rpc.magicblock.app/devnet/"
ledger = ".bolt/test-ledger"
rpc_port = 8899

[[test.validator.account]]
address = "EHLkWwAT9oebVv9ht3mtqrvHhRVMKrt54tF3MfHTey2K"
filename = "tests/fixtures/registry.json"
