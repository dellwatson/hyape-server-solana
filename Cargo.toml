[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.dependencies]
bolt-lang = "0.1.9"
anchor-lang = "0.30.1"
# solana-program = "1.17.0"
# solana-sdk = "1.17.0"
# spl-token = "3.1.0"
# spl-token-swap = "0.1.0"
# spl-token-metadata = "1.0.0"
# spl-token-lending = "0.1.0"
# spl-token-vault = "0.1.0"


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Uncomment this to use the latest in-development version of Bolt
# bolt-lang = { git = "https://github.com/magicblock-labs/bolt.git", branch = "main" }

# Uncomment this to use a local version of Bolt for development (bolt must be cloned above the current directory)
# bolt-lang = { path = "../bolt/crates/bolt-lang"}